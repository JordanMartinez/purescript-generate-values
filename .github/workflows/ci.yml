name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: "22"

      - uses: purescript-contrib/setup-purescript@main
        with:
          purescript: "unstable"
          purs-tidy: "latest"
          spago: "1.0.5"

      - name: Install dependencies
        run: spago install

      - name: Build source
        run: spago build

      - name: Run tests
        run: spago test

      - name: Check formatting
        run: purs-tidy check src test
